[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ghgmatch"
version = "0.1.0"
description = "Benchmark of text-matching methods for mapping procurement lines to spend-based emission factors"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "scikit-learn",
    "rapidfuzz",
    "matplotlib",
    "tabulate",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=3"]
dev = ["pytest"]

[project.scripts]
ghgmatch = "ghgmatch.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
